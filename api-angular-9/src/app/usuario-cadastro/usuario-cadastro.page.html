<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Cadastro Usuário</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="form">
    <ion-list>
      <ion-item>
        <ion-input 
        label="Primeiro Nome" 
        labelPlacement="stacked"
        formControlName="first_name" />
      </ion-item>

      <ion-item>
        <ion-input label="Último Nome" labelPlacement="stacked"
        formControlName="last_name" />
      </ion-item>

      <ion-item>
        <ion-input label="E-mail" labelPlacement="stacked"
        formControlName="email" />
      </ion-item>

      <ion-button routerLink="/home">Cancelar</ion-button>
      <ion-button (click)="cadastrar()">Salvar</ion-button>
    </ion-list>
  </form>
</ion-content>
