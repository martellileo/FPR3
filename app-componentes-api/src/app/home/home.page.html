<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Componentes </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item>
      <ion-input label="Nome" [(ngModel)]="pessoa.nome"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Endereço" [(ngModel)]="pessoa.endereco"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input type="number" label="Salário" [(ngModel)]="pessoa.salario"></ion-input>
    </ion-item>
  </ion-list>

  <ion-button (click)="adicionar()" expand="block"> Adicionar </ion-button>

  <ion-button (click)="exibir()">
    <ion-icon slot="icon-only" name="heart"></ion-icon>
  </ion-button>


  @if(pessoas.length > 0) {
  <ion-grid>
    <ion-row>
      <ion-col size="3"><strong>Nome</strong></ion-col>
      <ion-col size="5"><strong>Endereço</strong></ion-col>
      <ion-col size="3"><strong>Salário</strong></ion-col>
      <ion-col size="1"></ion-col>
    </ion-row>

    @for(item of pessoas; track $index; let index=$index) {
    <ion-row>
      <ion-col size="3">{{ item.nome }}</ion-col>
      <ion-col size="5">{{ item.endereco }}</ion-col>
      <ion-col size="3">{{ item.salario }}</ion-col>
      <ion-col size="1">
        <ion-icon name="trash" (click)="remover(index)"/>
      </ion-col>
    </ion-row>
    }
  </ion-grid>
  }
</ion-content>
