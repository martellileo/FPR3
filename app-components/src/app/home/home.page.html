<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Components </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large"> Components </ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- <ion-grid>
    <ion-row>
      <ion-col>1</ion-col>
      <ion-col>2</ion-col>
      <ion-col>3</ion-col>
    </ion-row>
  </ion-grid> -->

  <ion-list>
    <ion-item>
      <ion-input label="Nome" [(ngModel)]="pessoa.nome"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Endereço" [(ngModel)]="pessoa.endereco"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Salário" [(ngModel)]="pessoa.salario"></ion-input>
    </ion-item>
  </ion-list>

  @if(pessoas.length > 0) {
  <ion-grid>
    <ion-row>
      <ion-col><strong>Nome</strong></ion-col>
      <ion-col><strong>Endereço</strong></ion-col>
      <ion-col><strong>Salário</strong></ion-col>
      <ion-col size="1"></ion-col>
    </ion-row>

    @for(item of pessoas; track $index){
    <ion-row>
      <ion-col>{{ item.nome }}</ion-col>
      <ion-col>{{ item.endereco }}</ion-col>
      <ion-col>{{ item.salario }}</ion-col>
      <ion-col (click)="remover($index)" size="1"><ion-icon name="trash"></ion-icon></ion-col>
    </ion-row>
    }
  </ion-grid>
  }

  <ion-button (click)="adicionar()" expand="block"> Adicionar </ion-button>

  <ion-button>
    <ion-icon name="heart"></ion-icon>
  </ion-button>
</ion-content>
