<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Blank </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large"> Components </ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- <ion-grid>
    <ion-row>
      <ion-col>1</ion-col>
      <ion-col>2</ion-col>
      <ion-col>3</ion-col>
    </ion-row>
  </ion-grid> -->

  <ion-list>
    <ion-item>
      <ion-input label="Nome" [(ngModel)]="nome"></ion-input>
    </ion-item>
    <!-- <ion-item>
      <ion-input label="endereco"></ion-input>
    </ion-item> -->
  </ion-list>

  <ion-button (click)="adicionar()" expand="block"> Adicionar </ion-button>

  <ion-button>
    <ion-icon name="heart"></ion-icon>
  </ion-button>

  @if(pessoas.length > 0){
  <ion-list [inset]="true">
    <ion-label><strong>Nomes</strong></ion-label>
    @for(item of pessoas; track $index){
    <ion-item> {{ item }}</ion-item>
    }
  </ion-list>
  }
