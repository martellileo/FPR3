<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Produtos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Produtos</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let produto of produtos">
        <ion-card>
          <ion-card-header>
            <ion-card-title>{{ produto.nome }}</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <p><strong>ID:</strong> {{ produto.id }}</p>
            <p><strong>Quantidade:</strong> {{ produto.quantidade }}</p>
            <p><strong>Quantidade mínima:</strong> {{ produto.quantidadeMinima }}</p>
            <p><strong>Preço:</strong> {{ produto.preco }}</p>
            <p><strong>Status:</strong> {{ produto.status || 'Sem status' }}</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
