<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Detalhe Agendamento</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item>
      <strong> Médico </strong>
    </ion-item>

    <ion-item>
      <ion-label> <strong>Nome:</strong> {{medico.nome}}</ion-label>
    </ion-item>

    <ion-item>
      <ion-label> <strong>Especialidade:</strong> {{medico.especialidade}}</ion-label>
    </ion-item>

    <ion-item>
      <strong> Paciente </strong>
    </ion-item>

    <ion-item>
      <ion-label> <strong>Nome:</strong> {{paciente.nome}}</ion-label>
    </ion-item>

    <ion-item>
      <ion-label> <strong>Telefone:</strong> {{paciente.telefone}}</ion-label>
    </ion-item>

    <ion-item>
      <strong> Agendamento </strong>
    </ion-item>

    <ion-item>
      <ion-label> <strong>Status:</strong> {{agendamento.status}}</ion-label>
    </ion-item>

    <ion-item>
      <ion-label> <strong>Observações:</strong> {{agendamento.observacoes}}</ion-label>
    </ion-item>
  </ion-list>

  <ion-button routerLink="/agendamento"> Voltar </ion-button>
</ion-content>
