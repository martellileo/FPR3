<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">login</ion-title>
    </ion-toolbar>
  </ion-header>

  <h1>TaskFlow</h1>

  <p>Entre com a sua conta para ver as suas tarefas.</p>

  <form [formGroup]="form" (ngSubmit)="acessar()">
    <ion-item>
      <ion-input label="Email" formControlName="email" fill="outline" labelPlacement="floating"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="password" label="Password" formControlName="password" fill="outline" labelPlacement="floating">
        <ion-input-password-toggle slot="end" />
      </ion-input>
    </ion-item>

    <ion-button type="submit">Acessar</ion-button>
  </form>
</ion-content>
